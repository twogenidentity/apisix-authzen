[pytest]
# Live log: INFO lines stream to the terminal during the run (always visible).
log_cli            = true
log_cli_level      = INFO
log_cli_format     = %(asctime)s  %(levelname)-5s  %(name)-8s  %(message)s
log_cli_date_format = %H:%M:%S

# Captured log: DEBUG lines are buffered and printed only when a test fails.
log_level          = DEBUG
log_format         = %(asctime)s  %(levelname)-5s  %(name)-8s  %(message)s
log_date_format    = %H:%M:%S
