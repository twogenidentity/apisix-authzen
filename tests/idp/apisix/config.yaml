apisix:
  node_listen: 9080
  enable_ipv6: false

deployment:
  admin:
    admin_listen:
      ip: 0.0.0.0
      port: 9180
    allow_admin:
      - 0.0.0.0/0
    admin_key_required: true
    admin_key:
      - name: admin
        key: edd1c9f034335f136f87ad84b625c8f1
        role: admin
  role: traditional
  role_traditional:
    config_provider: etcd
  etcd:
    host:
      - "http://etcd:2379"
    prefix: /apisix
    timeout: 30

plugins:
  - openid-connect
  - authzen
  - proxy-rewrite

nginx_config:
  http_configuration_snippet: |
    lua_shared_dict authzen_store 10m;
