services:
  etcd:
    image: bitnamilegacy/etcd:3.4.9
    platform: linux/amd64
    environment:
      ETCD_ENABLE_V2: "true"
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: "http://etcd:2379"
      ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - idp-test-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.0
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: "http://keycloak:8080"
      KC_HOSTNAME_STRICT: "true"
      KC_LOG_LEVEL: WARN
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD", "/opt/keycloak/bin/kcadm.sh", "config", "credentials",
             "--server", "http://localhost:8080",
             "--realm", "master",
             "--user", "admin",
             "--password", "admin"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks:
      - idp-test-net

  keycloak-bootstrap:
    image: quay.io/keycloak/keycloak:26.2.0
    depends_on:
      keycloak:
        condition: service_healthy
    volumes:
      - ./keycloak/bootstrap.sh:/bootstrap.sh:ro
    entrypoint: ["bash", "/bootstrap.sh"]
    networks:
      - idp-test-net

  apisix:
    image: ${APISIX_IMAGE}
    restart: on-failure
    depends_on:
      etcd:
        condition: service_healthy
      keycloak-bootstrap:
        condition: service_completed_successfully
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ../../apisix-plugins/authzen.lua:/usr/local/apisix/apisix/plugins/authzen.lua:ro
    ports:
      - "9082:9080"
      - "9182:9180"
    networks:
      - idp-test-net

  mock-pdp:
    build:
      context: ../mock-pdp
    ports:
      - "8083:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - idp-test-net

  upstream:
    image: nginx:alpine
    volumes:
      - ../upstream/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - idp-test-net

  mock-mcp-upstream:
    build:
      context: ../mock-mcp-upstream
    networks:
      - idp-test-net

networks:
  idp-test-net:
    driver: bridge
